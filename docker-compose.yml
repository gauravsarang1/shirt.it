version: "3.9"

services:
  client:
    build: ./client
    ports:
      - "4000:4000"
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - server

  server:
    build: ./server
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev

  redis:
    image: redis:7
    ports:
      - "6379:6379"